<!DOCTYPE html>
<html lang="it" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viaggio nel Sistema Solare - Presentazione 3D</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js per la grafica 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Font Inter & Orbitron -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020208;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        /* Glassmorphism avanzato */
        .glass-panel {
            background: rgba(8, 12, 26, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.7);
        }

        .glass-card-front {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.94), rgba(3, 7, 18, 0.98));
            backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8);
        }

        .glass-card-back {
            background: linear-gradient(135deg, rgba(6, 14, 30, 0.98), rgba(15, 23, 42, 0.99));
            backdrop-filter: blur(24px);
            border: 1px solid rgba(56, 189, 248, 0.5);
            box-shadow: 0 12px 40px rgba(56, 189, 248, 0.25);
        }

        /* 3D Flip Card Container */
        .card-container {
            perspective: 1200px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.5);
            border-radius: 10px;
        }

        /* Card visibility animation */
        .card-hidden {
            opacity: 0;
            transform: scale(0.9) translateY(20px);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-visible {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
            50% { box-shadow: 0 0 35px rgba(56, 189, 248, 0.7); }
        }

        .pulse-glow {
            animation: pulseGlow 2.5s infinite;
        }

        @keyframes floatHint {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .float-hint {
            animation: floatHint 2s infinite ease-in-out;
        }
    </style>
</head>

        function generatePerlinNoise2D(width, height, octaveCount = 4) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.createImageData(width, height);
            const data = imgData.data;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let val = 0;
                    let freq = 1;
                    let amp = 1;
                    let maxVal = 0;

                    for (let o = 0; o < octaveCount; o++) {
                        const nx = (x / width) * 8 * freq;
                        const ny = (y / height) * 4 * freq;
                        const n = (Math.sin(nx) + Math.cos(ny) + Math.sin(nx * 1.5 + ny * 2.1)) * 0.5 + 0.5;
                        val += n * amp;
                        maxVal += amp;
                        amp *= 0.5;
                        freq *= 2;
                    }

                    val = val / maxVal;
                    const idx = (y * width + x) * 4;
                    const c = Math.floor(val * 255);
                    data[idx] = c;
                    data[idx + 1] = c;
                    data[idx + 2] = c;
                    data[idx + 3] = 255;
                }
            }
            ctx.putImageData(imgData, 0, 0);
            return canvas;
        }

        function generatePhotorealisticTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            // Riempi lo sfondo per evitare qualsiasi cucitura ai bordi 0 e 2048
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, 2048, 1024);

            if (type === 'sun') {
                const grad = ctx.createLinearGradient(0, 0, 0, 1024);
                grad.addColorStop(0, '#ff2200');
                grad.addColorStop(0.2, '#ff5500');
                grad.addColorStop(0.5, '#ffaa00');
                grad.addColorStop(0.8, '#ff4400');
                grad.addColorStop(1, '#ff1100');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 2048, 1024);

                const noise = generatePerlinNoise2D(2048, 1024, 5);
                ctx.globalCompositeOperation = 'color-dodge';
                ctx.globalAlpha = 0.65;
                ctx.drawImage(noise, 0, 0);

                ctx.globalCompositeOperation = 'multiply';
                ctx.globalAlpha = 0.35;
                ctx.drawImage(noise, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;

            } else if (type === 'mercury' || type === 'moon') {
                const grad = ctx.createLinearGradient(0, 0, 2048, 1024);
                grad.addColorStop(0, '#3f3f46');
                grad.addColorStop(0.25, '#71717a');
                grad.addColorStop(0.5, '#52525b');
                grad.addColorStop(0.75, '#64748b');
                grad.addColorStop(1, '#3f3f46');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 2048, 1024);

                const noise = generatePerlinNoise2D(2048, 1024, 6);
                ctx.globalCompositeOperation = 'overlay';
                ctx.globalAlpha = 0.6;
                ctx.drawImage(noise, 0, 0);

                ctx.globalCompositeOperation = 'soft-light';
                ctx.globalAlpha = 0.8;
                ctx.drawImage(noise, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;

            } else if (type === 'venus') {
                const grad = ctx.createLinearGradient(0, 0, 0, 1024);
                grad.addColorStop(0, '#78350f');
                grad.addColorStop(0.25, '#b45309');
                grad.addColorStop(0.5, '#f59e0b');
                grad.addColorStop(0.75, '#d97706');
                grad.addColorStop(1, '#92400e');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 2048, 1024);

                const noise = generatePerlinNoise2D(2048, 1024, 4);
                ctx.globalCompositeOperation = 'overlay';
                ctx.globalAlpha = 0.55;
                ctx.drawImage(noise, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;

            } else if (type === 'earth') {
                const oceanGrad = ctx.createLinearGradient(0, 0, 0, 1024);
                oceanGrad.addColorStop(0, '#0284c7');
                oceanGrad.addColorStop(0.3, '#1e3a8a');
                oceanGrad.addColorStop(0.5, '#0f172a');
                oceanGrad.addColorStop(0.7, '#1e3a8a');
                oceanGrad.addColorStop(1, '#0284c7');
                ctx.fillStyle = oceanGrad;
                ctx.fillRect(0, 0, 2048, 1024);

                const noiseCanvas = generatePerlinNoise2D(2048, 1024, 5);
                const noiseCtx = noiseCanvas.getContext('2d');
                const nData = noiseCtx.getImageData(0, 0, 2048, 1024);
                const pixels = nData.data;

                for (let y = 0; y < 1024; y++) {
                    const lat = Math.abs(y - 512) / 512;
                    for (let x = 0; x < 2048; x++) {
                        const i = (y * 2048 + x) * 4;
                        const val = pixels[i];
                        
                        if (val > 115 && lat < 0.88) {
                            if (val > 165) {
                                ctx.fillStyle = '#15803d';
                            } else if (val > 140) {
                                ctx.fillStyle = '#b45309';
                            } else {
                                ctx.fillStyle = '#65a30d';
                            }
                            ctx.fillRect(x, y, 2.2, 2.2);

                    }
                }

                polarGradTop.addColorStop(0, 'rgba(255,255,255,1)');
                polarGradTop.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = polarGradTop;
                ctx.fillRect(0, 0, 2048, 90);

                const polarGradBot = ctx.createLinearGradient(0, 934, 0, 1024);
                polarGradBot.addColorStop(0, 'rgba(255,255,255,0)');
                polarGradBot.addColorStop(1, 'rgba(255,255,255,1)');
                ctx.fillStyle = polarGradBot;
                ctx.fillRect(0, 934, 2048, 90);

            } else if (type === 'earth_clouds') {
                ctx.clearRect(0, 0, 2048, 1024);
                const cloudNoise = generatePerlinNoise2D(2048, 1024, 4);
                const cCtx = cloudNoise.getContext('2d');
                const cData = cCtx.getImageData(0, 0, 2048, 1024);
                const p = cData.data;

                    for (let x = 0; x < 2048; x++) {
                        const i = (y * 2048 + x) * 4;
                        if (p[i] > 130) {
                            const alpha = (p[i] - 130) / 125;
                            ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
                            ctx.fillRect(x, y, 2.5, 2.5);
                        }
                    }
                }

            } else if (type === 'mars') {
                const grad = ctx.createLinearGradient(0, 0, 2048, 1024);
                grad.addColorStop(0, '#9a3412');
                grad.addColorStop(0.2, '#c2410c');
                grad.addColorStop(0.4, '#ea580c');
                grad.addColorStop(0.7, '#7c2d12');
                grad.addColorStop(1, '#9a3412');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 2048, 1024);

                const noise = generatePerlinNoise2D(2048, 1024, 5);
                ctx.globalCompositeOperation = 'multiply';
                ctx.globalAlpha = 0.45;
                ctx.drawImage(noise, 0, 0);

                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;

                ctx.fillStyle = 'rgba(67, 20, 7, 0.75)';
                ctx.beginPath();
                ctx.moveTo(400, 520);
                ctx.bezierCurveTo(800, 570, 1300, 470, 1640, 550);
                ctx.bezierCurveTo(1300, 610, 800, 630, 400, 560);
                ctx.fill();

                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.ellipse(1024, 20, 1024, 35, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(1024, 1004, 1024, 35, 0, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 'jupiter') {
                for (let y = 0; y < 1024; y++) {
                    const wave = Math.sin(y / 24) * 25 + Math.cos(y / 10) * 15;
                    ctx.fillStyle = `rgb(${210 + wave}, ${145 + wave * 0.6}, ${85 + wave * 0.3})`;
                    ctx.fillRect(0, y, 2048, 1);
                }

                const noise = generatePerlinNoise2D(2048, 1024, 4);
                ctx.globalCompositeOperation = 'soft-light';
                ctx.globalAlpha = 0.65;
                ctx.drawImage(noise, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;

                const redSpotGrad = ctx.createRadialGradient(1360, 620, 8, 1360, 620, 120);
                redSpotGrad.addColorStop(0, '#991b1b');
                redSpotGrad.addColorStop(0.6, '#dc2626');
                redSpotGrad.addColorStop(1, 'rgba(217, 119, 6, 0)');
                ctx.fillStyle = redSpotGrad;
                ctx.beginPath();
                ctx.ellipse(1360, 620, 120, 75, 0, 0, Math.PI * 2);
                ctx.fill();

            } else if (type === 'saturn') {
                for (let y = 0; y < 1024; y++) {
                    const band = Math.sin(y / 16) * 20;
                    ctx.fillStyle = `rgb(${225 + band}, ${185 + band}, ${125 + band * 0.4})`;
                    ctx.fillRect(0, y, 2048, 1);
                }

                const noise = generatePerlinNoise2D(2048, 1024, 4);
                ctx.globalCompositeOperation = 'overlay';
                ctx.globalAlpha = 0.35;
                ctx.drawImage(noise, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;

            } else if (type === 'saturn_ring') {
                const ringCanvas = document.createElement('canvas');
                ringCanvas.width = 1024;
                ringCanvas.height = 1024;
                const rCtx = ringCanvas.getContext('2d');
                const grad = rCtx.createRadialGradient(512, 512, 180, 512, 512, 500);
                grad.addColorStop(0, 'rgba(0,0,0,0)');
                grad.addColorStop(0.35, 'rgba(217, 119, 6, 0.9)');
                grad.addColorStop(0.55, 'rgba(251, 191, 36, 0.85)');
                grad.addColorStop(0.75, 'rgba(120, 53, 15, 0.4)');
                grad.addColorStop(1, 'rgba(245, 158, 11, 0.85)');
                rCtx.fillStyle = grad;
                rCtx.fillRect(0, 0, 1024, 1024);
                return new THREE.CanvasTexture(ringCanvas);

            } else if (type === 'uranus') {
                const grad = ctx.createLinearGradient(0, 0, 0, 1024);
                grad.addColorStop(0, '#06b6d4');
                grad.addColorStop(0.3, '#22d3ee');
                grad.addColorStop(0.7, '#0891b2');
                grad.addColorStop(1, '#0e7490');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 2048, 1024);

                const noise = generatePerlinNoise2D(2048, 1024, 3);
                ctx.globalCompositeOperation = 'overlay';
                ctx.globalAlpha = 0.3;
                ctx.drawImage(noise, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;

            } else if (type === 'neptune') {
                const grad = ctx.createLinearGradient(0, 0, 2048, 1024);
                grad.addColorStop(0, '#1d4ed8');
                grad.addColorStop(0.3, '#2563eb');
                grad.addColorStop(0.6, '#1e40af');
                grad.addColorStop(1, '#1e3a8a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 2048, 1024);

                const noise = generatePerlinNoise2D(2048, 1024, 4);
                ctx.globalCompositeOperation = 'soft-light';
                ctx.globalAlpha = 0.5;
                ctx.drawImage(noise, 0, 0);
                ctx.globalCompositeOperation = 'source-over';
                ctx.globalAlpha = 1.0;

                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.ellipse(700, 440, 220, 12, Math.PI / 16, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'rgba(15, 23, 42, 0.65)';
                ctx.beginPath();
                ctx.ellipse(1100, 580, 140, 75, -Math.PI / 12, 0, Math.PI * 2);
                ctx.fill();
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;
            return texture;
        }

        // ===================================================
        // SCENA THREE.JS CON SHADER E ILLUMINAZIONE SPAZIALE REALISTICA
        // ===================================================
        let scene, camera, renderer, controls;
        let planetGroup, earthCloudsMesh;
        let currentModels = {};
        let raycaster, mouse;

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x020208, 0.006);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 9.8);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 20;
            controls.minDistance = 3.8;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffffff, 1.8);
            mainLight.position.set(7, 4, 6);
            scene.add(mainLight);

            const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.5);
            rimLight.position.set(-7, -4, -6);
            scene.add(rimLight);

            createStarfield();

            planetGroup = new THREE.Group();
            scene.add(planetGroup);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            buildPlanetModels();
            update3DScene('sun');

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('pointerdown', onPointerDown);

            animate();
        }

        function createStarfield() {
            const starsGeometry = new THREE.BufferGeometry();
            const count = 5000;
            const positions = new Float32Array(count * 3);

            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 280;
                positions[i + 1] = (Math.random() - 0.5) * 280;
                positions[i + 2] = (Math.random() - 0.5) * 280;
            }

            starsGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starsMaterial = new THREE.PointsMaterial({ size: 0.8, color: 0xffffff, transparent: true, opacity: 0.85 });
            scene.add(new THREE.Points(starsGeometry, starsMaterial));
        }

        function buildPlanetModels() {
            // 1. SOLE
            const sunGroup = new THREE.Group();
            const sunTex = generatePhotorealisticTexture('sun');
            const sunGeo = new THREE.SphereGeometry(2.7, 64, 64);
            const sunMat = new THREE.MeshBasicMaterial({ map: sunTex });
            sunGroup.add(new THREE.Mesh(sunGeo, sunMat));

            const coronaGeo = new THREE.SphereGeometry(3.05, 32, 32);
            const coronaMat = new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.3, side: THREE.BackSide });
            sunGroup.add(new THREE.Mesh(coronaGeo, coronaMat));
            currentModels['sun'] = sunGroup;

            // 2. MERCURIO
            const mercGroup = new THREE.Group();
            const mercTex = generatePhotorealisticTexture('mercury');
            const mercGeo = new THREE.SphereGeometry(2.3, 64, 64);
            const mercMat = new THREE.MeshStandardMaterial({ map: mercTex, roughness: 0.85, metalness: 0.15 });
            mercGroup.add(new THREE.Mesh(mercGeo, mercMat));
            currentModels['mercury'] = mercGroup;

            // 3. VENERE
            const venGroup = new THREE.Group();
            const venTex = generatePhotorealisticTexture('venus');
            const venGeo = new THREE.SphereGeometry(2.45, 64, 64);
            const venMat = new THREE.MeshStandardMaterial({ map: venTex, roughness: 0.35, metalness: 0.05 });
            venGroup.add(new THREE.Mesh(venGeo, venMat));
            currentModels['venus'] = venGroup;

            // 4. TERRA
            const earthGroup = new THREE.Group();
            const earthTex = generatePhotorealisticTexture('earth');
            const earthGeo = new THREE.SphereGeometry(2.5, 64, 64);
            const earthMat = new THREE.MeshStandardMaterial({ map: earthTex, roughness: 0.45, metalness: 0.1 });
            earthGroup.add(new THREE.Mesh(earthGeo, earthMat));

            const cloudTex = generatePhotorealisticTexture('earth_clouds');
            const cloudGeo = new THREE.SphereGeometry(2.53, 64, 64);
            const cloudMat = new THREE.MeshStandardMaterial({ map: cloudTex, transparent: true, opacity: 0.7 });
            earthCloudsMesh = new THREE.Mesh(cloudGeo, cloudMat);
            earthGroup.add(earthCloudsMesh);
            // 7. FASCIA DI ASTEROIDI (Disposta in modo ellittico e allineato, non circolare, per riflettere le vere orbite kepleriane)
            const astGroup = new THREE.Group();
            const asteroidCount = 1800;
            
            for (let i = 0; i < asteroidCount; i++) {
                const angle = (i / asteroidCount) * Math.PI * 2;
                
                // Orbita ellittica realistica (semiasse maggiore e minore differenziati)
                const semiMajorAxis = 2.8;
                const semiMinorAxis = 2.1;
                
                // Aggiungiamo una leggera dispersione casuale per renderla naturale ma mantenendo l'allineamento ellittico
                const rVariation = (Math.random() - 0.5) * 0.35;
                const x = Math.cos(angle) * (semiMajorAxis + rVariation);
                const z = Math.sin(angle) * (semiMinorAxis + rVariation);
                const y = (Math.random() - 0.5) * 0.12;

                const geomType = Math.random();
                let asteroidGeo;
                if (geomType < 0.33) {
                    asteroidGeo = new THREE.DodecahedronGeometry(0.04 + Math.random() * 0.05, 0);
                } else if (geomType < 0.66) {
                    asteroidGeo = new THREE.IcosahedronGeometry(0.03 + Math.random() * 0.06, 0);
                } else {
                    asteroidGeo = new THREE.BoxGeometry(0.05 + Math.random() * 0.05, 0.03 + Math.random() * 0.04, 0.04 + Math.random() * 0.05);
                }

                const greyShade = 0.35 + Math.random() * 0.35;
                const asteroidMat = new THREE.MeshStandardMaterial({ 
                    color: new THREE.Color(greyShade, greyShade * 0.92, greyShade * 0.88), 
                    roughness: 0.9, 
                    metalness: 0.35 
                });

                const mesh = new THREE.Mesh(asteroidGeo, asteroidMat);
                mesh.position.set(x, y, z);
                mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                
                const scaleX = 0.6 + Math.random() * 1.3;
                const scaleY = 0.5 + Math.random() * 1.1;
                const scaleZ = 0.6 + Math.random() * 1.3;
                mesh.scale.set(scaleX, scaleY, scaleZ);

                astGroup.add(mesh);
            }
            currentModels['asteroids'] = astGroup;

            // 8. GIOVE
            const jupGroup = new THREE.Group();
            const jupTex = generatePhotorealisticTexture('jupiter');
            const jupGeo = new THREE.SphereGeometry(2.8, 64, 64);
            const jupMat = new THREE.MeshStandardMaterial({ map: jupTex, roughness: 0.5 });
            jupGroup.add(new THREE.Mesh(jupGeo, jupMat));
            currentModels['jupiter'] = jupGroup;

            // 9. SATURNO
            const satGroup = new THREE.Group();
            const satTex = generatePhotorealisticTexture('saturn');
            const satGeo = new THREE.SphereGeometry(2.4, 64, 64);
            const satMat = new THREE.MeshStandardMaterial({ map: satTex, roughness: 0.5 });
            satGroup.add(new THREE.Mesh(satGeo, satMat));

            const ringTex = generatePhotorealisticTexture('saturn_ring');
            const ringGeo = new THREE.RingGeometry(2.9, 4.8, 64);
            const ringMat = new THREE.MeshStandardMaterial({ map: ringTex, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
            const ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.x = Math.PI / 2.2;
            satGroup.add(ringMesh);
            currentModels['saturn'] = satGroup;

            // 10. URANO
            const uranGroup = new THREE.Group();
            const uranTex = generatePhotorealisticTexture('uranus');
            const uranGeo = new THREE.SphereGeometry(2.4, 64, 64);
            const uranMat = new THREE.MeshStandardMaterial({ map: uranTex, roughness: 0.3 });
            uranGroup.add(new THREE.Mesh(uranGeo, uranMat));
            uranGroup.rotation.z = Math.PI / 1.8;
            currentModels['uranus'] = uranGroup;

            // 11. NETTUNO
            const nepGroup = new THREE.Group();
            const nepTex = generatePhotorealisticTexture('neptune');
            const nepGeo = new THREE.SphereGeometry(2.4, 64, 64);
            const nepMat = new THREE.MeshStandardMaterial({ map: nepTex, roughness: 0.3 });
            nepGroup.add(new THREE.Mesh(nepGeo, nepMat));
            currentModels['neptune'] = nepGroup;
        }

        function update3DScene(key) {
            while (planetGroup.children.length > 0) {
                planetGroup.remove(planetGroup.children[0]);
            }
            if (currentModels[key]) {
                planetGroup.add(currentModels[key]);
            }
        }

        function onPointerDown(event) {
            const startX = event.clientX;
            const startY = event.clientY;

            const onPointerUp = (upEvent) => {
                window.removeEventListener('pointerup', onPointerUp);
                const diffX = Math.abs(upEvent.clientX - startX);
                const diffY = Math.abs(upEvent.clientY - startY);

                if (diffX < 5 && diffY < 5) {
                    mouse.x = (upEvent.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(upEvent.clientY / window.innerHeight) * 2 + 1;

                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(planetGroup.children, true);

                    if (intersects.length > 0) {
                        triggerPlanetClick();
                    }
                }
            };

            window.addEventListener('pointerup', onPointerUp);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (planetGroup) {
                planetGroup.rotation.y += 0.002;
            }

            if (earthCloudsMesh) {
                earthCloudsMesh.rotation.y += 0.003;
            }

            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = function() {
            renderSlidesUI();
            initThreeJS();
        };
    </script>
</body>
